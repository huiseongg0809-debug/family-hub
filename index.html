let bgmCtx=null,bgmOn=false,bgmPadTimer=null,bgmPluckTimer=null;
function bgmNote(freq,t,dur,vol,type){
  const o=bgmCtx.createOscillator(),g=bgmCtx.createGain();
  o.type=type||'sine';o.frequency.value=freq;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.9);
  g.gain.setValueAtTime(vol,t+Math.max(0.9,dur-1.2));g.gain.linearRampToValueAtTime(0,t+dur);
  o.connect(g);g.connect(bgmCtx.destination);o.start(t);o.stop(t+dur+0.1);
}
function startBgm(){
  if(!bgmCtx) bgmCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(bgmCtx.state==='suspended') bgmCtx.resume();
  const chords=[[261.63,329.63,392.00],[220.00,261.63,329.63],[174.61,220.00,261.63],[196.00,246.94,293.66]];
  const penta=[523.25,587.33,659.25,783.99,880.00,1046.50];
  let ci=0;
  const pad=()=>{const t=bgmCtx.currentTime;chords[ci%chords.length].forEach(f=>bgmNote(f,t,9,0.035));ci++;};
  pad();bgmPadTimer=setInterval(pad,8000);
  bgmPluckTimer=setInterval(()=>{if(!bgmOn)return;const t=bgmCtx.currentTime;bgmNote(penta[Math.floor(Math.random()*penta.length)],t,3,0.03);},2600);
}
function stopBgm(){clearInterval(bgmPadTimer);clearInterval(bgmPluckTimer);bgmPadTimer=bgmPluckTimer=null;}
function toggleBgm(){
  bgmOn=!bgmOn;
  const b=document.getElementById('bgmBtn');
  b.textContent=bgmOn?'🎶':'🎵';b.classList.toggle('on',bgmOn);
  try{localStorage.setItem('bgm',bgmOn?'1':'0');}catch(e){}
  if(bgmOn)startBgm();else stopBgm();
}

let curPf='stock';
function setPf(k,btn){curPf=k;document.querySelectorAll('#pfTabs .subtab').forEach(b=>b.classList.remove('on'));btn.classList.add('on');loadPf();}
async function loadPf(){
  const q=await db.collection('pf').where('kind','==',curPf).get();
  const docs=q.docs.sort((a,b)=>(b.data().createdAt||0)-(a.data().createdAt||0));
  let sum=0;docs.forEach(d=>sum+=parseFloat(d.data().pct)||0);
  const box=document.getElementById('pfList');
  box.innerHTML=docs.map(d=>`<div class="card" style="display:flex;gap:10px;align-items:center"><div style="flex:1"><b>${esc(d.data().name)}</b></div><div style="font-weight:800">${d.data().pct}%</div><button class="mini" onclick="delDoc('pf','${d.id}');loadPf()">삭제</button></div>`).join('')||'<p>아직 보유 목록이 없어요.</p>';
  box.innerHTML+=`<p style="color:var(--muted);font-size:13px">합계 ${Math.round(sum*10)/10}%</p>`;
}
async function addPf(){
  const name=document.getElementById('pfName').value.trim();
  const pct=parseFloat(document.getElementById('pfPct').value);
  if(!name)return alert('이름을 입력하세요.');
  if(isNaN(pct))return alert('퍼센테지를 입력하세요.');
  await db.collection('pf').add({kind:curPf,name,pct,createdAt:Date.now()});
  document.getElementById('pfName').value='';document.getElementById('pfPct').value='';
  loadPf();
}
</script>

<script>
firebase.initializeApp({apiKey:"AIzaSyBKxVL_tkaFos6CMKEUX7LUWuGcJOC5-yU",authDomain:"family-hub-7681f.firebaseapp.com",projectId:"family-hub-7681f",storageBucket:"family-hub-7681f.firebasestorage.app",messagingSenderId:"407038030549",appId:"1:407038030549:web:7b548db3755940b2bd685c"});
const auth=firebase.auth(), db=firebase.firestore();
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const myName=()=>localStorage.getItem("famName")||"가족";
function showTab(id,btn){document.querySelectorAll(".tab").forEach(t=>t.classList.remove("on"));document.getElementById(id).classList.add("on");document.querySelectorAll("nav button").forEach(b=>b.classList.remove("on"));btn.classList.add("on");if(id==="photos")renderGallery();if(id==="chat")loadChat();if(id==="pf")loadPf();}
async function doLogin(){const idv=document.getElementById("email").value.trim(),e=idv.includes("@")?idv:(idv==="우리 가족"?"gajok@ourhome.site":idv),p=document.getElementById("pw").value;try{await auth.signInWithEmailAndPassword(e,p);}catch(err){document.getElementById("loginMsg").textContent="로그인 실패: 아이디/비밀번호를 확인하세요.";}}
function logout(){auth.signOut();}
auth.onAuthStateChanged(u=>{document.getElementById("login").style.display=u?"none":"block";document.getElementById("app").style.display=u?"block":"none";document.getElementById("logoutBtn").style.display=u?"inline-block":"none";if(u){renderGallery();loadPosts();renderCal();loadChat();}});
async function delDoc(col,id){if(!confirm("삭제할까요?"))return;await db.collection(col).doc(id).delete();}

// 갤러리
function compress(file){return new Promise(res=>{const img=new Image();img.onload=()=>{const m=1000,s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=img.width*s;c.height=img.height*s;c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",0.75));};img.src=URL.createObjectURL(file);});}
async function uploadPhoto(fileId,nameId,extra){fileId=fileId||"photoFile";nameId=nameId||"photoName";const f=document.getElementById(fileId).files[0];if(!f)return alert("사진을 선택하세요.");const data=await compress(f);const name=document.getElementById(nameId).value.trim()||myName();localStorage.setItem("famName",name);await db.collection("photos").add(Object.assign({author:name,data,createdAt:firebase.firestore.FieldValue.serverTimestamp()},extra||{}));document.getElementById(fileId).value="";renderGallery();}
let curAlbum='단체 사진';
function renderAlbums(){
  const box=document.getElementById('albumCards');
  if(!box||box.children.length) return;
  const hero=document.querySelector('.hero img');
  const strip=[...document.querySelectorAll('.strip img')];
  const covers=[['단체 사진',hero?hero.src:''],['개인 사진',strip[2]?strip[2].src:''],['짤방',strip[9]?strip[9].src:''],['특별관',strip[8]?strip[8].src:'']];
  box.innerHTML=covers.map(([name,src],i)=>`<button class="album${i===0?' on':''}" onclick="setAlbum('${name}',this)"><img src="${src}" alt="${name}"></button>`).join('');
}
renderAlbums();
function seedPhotos(){
  const hero=document.querySelector('.hero img');
  const strip=[...document.querySelectorAll('.strip img')];
  const albumByStrip=['짤방','개인 사진','개인 사진','개인 사진','개인 사진','개인 사진','개인 사진','개인 사진','짤방','짤방','개인 사진'];
  const seeds=[];
  if(hero) seeds.push({album:'단체 사진', src:hero.src});
  strip.forEach((im,i)=>seeds.push({album:albumByStrip[i]||'가족', src:im.src}));
  return seeds;
}
let curEvent=null;
function setAlbum(a,btn){curAlbum=a;curEvent=null;document.querySelectorAll('#albumCards .album').forEach(b=>b.classList.remove('on'));btn.classList.add('on');renderGallery();}
async function renderGallery(){
  const grid=document.getElementById('photoGrid');
  const up=document.getElementById('mainUploadCard');
  if(up)up.style.display=curAlbum==='특별관'?'none':'';
  if(curAlbum==='특별관'){await renderSpecial();return;}
  const seeds=seedPhotos().filter(p=>p.album===curAlbum);
  let html=seeds.map((p,i)=>`<div><img src="${p.src}"><div style="font-size:12px;color:#999;margin-top:4px">${p.album} <a href="${p.src}" download="가족사진-${p.album}-${i+1}.jpg" class="mini" style="text-decoration:none">저장</a></div></div>`).join('');
  if(curAlbum==='개인 사진'){
    const q=await db.collection('photos').orderBy('createdAt','desc').limit(100).get();
    html+=q.docs.filter(d=>d.data().album!=='특별관').map(d=>`<div><img src="${d.data().data}"><div style="font-size:12px;color:#999;margin-top:4px">${esc(d.data().author)} <a href="${d.data().data}" download="가족사진-${esc(d.data().author)}.jpg" class="mini" style="text-decoration:none">저장</a> <button class="mini" onclick="delDoc('photos','${d.id}');renderGallery()">삭제</button></div></div>`).join('');
  }
  grid.innerHTML=html||'<p>이 앨범에 사진이 없어요.</p>';
}
function ts(v){return v&&v.toMillis?v.toMillis():(v||0);}
async function renderSpecial(){
  const grid=document.getElementById('photoGrid');
  if(curEvent){
    const q=await db.collection('photos').limit(200).get();
    const docs=q.docs.filter(d=>{const x=d.data();return x.album==='특별관'&&x.event===curEvent;}).sort((a,b)=>ts(b.data().createdAt)-ts(a.data().createdAt));
    let html=`<div class="card"><button class="mini" onclick="curEvent=null;renderGallery()">← 행사 목록</button> <b style="font-size:17px">${esc(curEvent)}</b></div>`;
    if(!docs.length)html+='<p>아직 사진이 없어요. 아래에서 올려보세요.</p>';
    html+=`<div class="grid">`+docs.map(d=>`<div><img src="${d.data().data}"><div style="font-size:12px;color:#999;margin-top:4px">${esc(d.data().author)} <a href="${d.data().data}" download="가족사진-${esc(d.data().author)}.jpg" class="mini" style="text-decoration:none">저장</a> <button class="mini" onclick="delDoc('photos','${d.id}');renderGallery()">삭제</button></div></div>`).join('')+`</div>`;
    html+=`<div class="card"><input type="file" id="eventPhotoFile" accept="image/*"><input id="eventPhotoName" placeholder="이름"><button class="act" onclick="uploadPhoto('eventPhotoFile','eventPhotoName',{album:'특별관',event:curEvent})">사진 올리기</button></div>`;
    grid.innerHTML=html;
    return;
  }
  const aq=await db.collection('eventAlbums').orderBy('createdAt','desc').limit(50).get();
  const pq=await db.collection('photos').limit(200).get();
  const specials=pq.docs.filter(d=>d.data().album==='특별관');
  let html=`<div class="card"><input id="eventName" placeholder="행사 이름 (예: 칠순잔치, 생일 파티)"><button class="act" onclick="createEvent()">행사 만들기</button><p style="font-size:12px;color:var(--muted)">칠순잔치, 팔순잔치, 생일 파티 같은 행사 이름을 만들어 사진을 모아보세요.</p></div>`;
  if(!aq.docs.length)html+='<p>아직 만든 행사가 없어요. 위에서 행사 이름을 만들어보세요.</p>';
  aq.docs.forEach(doc=>{
    const name=doc.data().name;
    const ph=specials.filter(d=>d.data().event===name);
    const thumb=ph.length?ph[0].data().data:'';
    html+=`<div class="card event-card" data-name="${esc(name)}" style="cursor:pointer;display:flex;gap:12px;align-items:center">${thumb?`<img src="${thumb}" style="width:64px;height:64px;object-fit:cover;border-radius:12px">`:`<div style="width:64px;height:64px;border-radius:12px;background:linear-gradient(135deg,#ff6b4a,#ff9e57);display:flex;align-items:center;justify-content:center;font-size:28px">🎉</div>`}<div style="flex:1"><b>${esc(name)}</b><p style="color:var(--muted);font-size:13px;margin:2px 0">사진 ${ph.length}장</p></div><button class="mini event-del">삭제</button></div>`;
  });
  grid.innerHTML=html;
  grid.querySelectorAll('.event-card').forEach(el=>{
    el.addEventListener('click',()=>{curEvent=el.dataset.name;renderGallery();});
    el.querySelector('.event-del').addEventListener('click',async ev=>{ev.stopPropagation();await deleteEvent(el.dataset.name);});
  });
}
async function createEvent(){
  const el=document.getElementById('eventName');const name=(el.value||'').trim();
  if(!name){alert('행사 이름을 입력하세요.');return;}
  await db.collection('eventAlbums').add({name,createdAt:Date.now(),author:'가족'});
  el.value='';renderGallery();
}
async function deleteEvent(name){
  if(!confirm('['+name+'] 행사와 안의 사진을 모두 삭제할까요?'))return;
  const aq=await db.collection('eventAlbums').where('name','==',name).get();
  aq.docs.forEach(d=>d.ref.delete());
  const pq=await db.collection('photos').where('album','==','특별관').get();
  const jobs=[];pq.docs.forEach(d=>{if(d.data().event===name)jobs.push(d.ref.delete());});
  await Promise.all(jobs);renderGallery();
}

// 게시판
async function addPost(){const t=document.getElementById("postTitle").value.trim(),b=document.getElementById("postBody").value.trim();if(!t||!b)return alert("제목과 내용을 입력하세요.");const n=document.getElementById("postName").value.trim()||myName();localStorage.setItem("famName",n);await db.collection("posts").add({author:n,title:t,body:b,createdAt:firebase.firestore.FieldValue.serverTimestamp()});document.getElementById("postTitle").value="";document.getElementById("postBody").value="";loadPosts();}
async function loadPosts(){const q=await db.collection("posts").orderBy("createdAt","desc").limit(100).get();document.getElementById("postList").innerHTML=q.docs.map(d=>{const v=d.data();return `<div class="card"><div class="meta">${esc(v.author)} · ${v.createdAt?v.createdAt.toDate().toLocaleString("ko-KR"):""}</div><b>${esc(v.title)}</b><p style="white-space:pre-wrap">${esc(v.body)}</p><button class="mini" onclick="delDoc('posts','${d.id}');loadPosts()">삭제</button></div>`;}).join("")||"<p>아직 글이 없어요.</p>";}

// 일정
let calY=new Date().getFullYear(), calM=new Date().getMonth();
function moveMonth(d){calM+=d;if(calM<0){calM=11;calY--;}if(calM>11){calM=0;calY++;}renderCal();}
async function renderCal(){document.getElementById("calTitle").textContent=calY+"년 "+(calM+1)+"월";const first=new Date(calY,calM,1),days=new Date(calY,calM+1,0).getDate();const q=await db.collection("events").get();const evs=q.docs.map(d=>({id:d.id,...d.data()}));const inMonth=evs.filter(e=>{const dt=new Date(e.event_date);return dt.getFullYear()===calY&&dt.getMonth()===calM;});let html=["일","월","화","수","목","금","토"].map(x=>`<div style="color:#999">${x}</div>`).join("");for(let i=0;i<first.getDay();i++)html+="<div></div>";for(let d=1;d<=days;d++){const has=inMonth.some(e=>new Date(e.event_date).getDate()===d);html+=`<div class="${has?"has":""}">${d}</div>`;}document.getElementById("calgrid").innerHTML=html;document.getElementById("evList").innerHTML=inMonth.sort((a,b)=>a.event_date.localeCompare(b.event_date)).map(e=>`<div class="card"><div class="meta">${esc(e.event_date)}</div><b>${esc(e.title)}</b><p>${esc(e.note||"")}</p><button class="mini" onclick="delDoc('events','${e.id}');renderCal()">삭제</button></div>`).join("")||"<p>이 달의 일정이 없어요.</p>";}
async function addEvent(){const dt=document.getElementById("evDate").value,t=document.getElementById("evTitle").value.trim();if(!dt||!t)return alert("날짜와 제목을 입력하세요.");await db.collection("events").add({title:t,note:document.getElementById("evNote").value.trim(),event_date:dt,createdAt:firebase.firestore.FieldValue.serverTimestamp()});document.getElementById("evTitle").value="";document.getElementById("evNote").value="";renderCal();}

// 채팅
async function loadChat(){const q=await db.collection("messages").orderBy("createdAt","asc").limit(200).get();const box=document.getElementById("chatbox");box.innerHTML=q.docs.map(d=>{const v=d.data();return `<div class="msg"><b>${esc(v.author)}</b> <span style="font-size:12px;color:#999">${v.createdAt?v.createdAt.toDate().toLocaleString("ko-KR"):""}</span><br>${esc(v.body)}</div>`;}).join("");box.scrollTop=box.scrollHeight;}
async function sendChat(){const t=document.getElementById("chatText").value.trim();if(!t)return;const n=document.getElementById("chatName").value.trim()||myName();localStorage.setItem("famName",n);await db.collection("messages").add({author:n,body:t,createdAt:firebase.firestore.FieldValue.serverTimestamp()});document.getElementById("chatText").value="";loadChat();}
setInterval(()=>{if(document.getElementById("chat").classList.contains("on"))loadChat();},4000);
